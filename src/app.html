<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f7f4ee" />
		<meta name="color-scheme" content="light" />

		<meta
			http-equiv="Content-Security-Policy"
			content="
				default-src 'self';
				script-src 'self' 'unsafe-inline' blob:;
				style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
				img-src 'self' blob: data:;
				font-src 'self' https://fonts.gstatic.com;
				connect-src 'self' blob:;
				worker-src 'self' blob:;
				frame-src 'self' blob: data:;
				child-src 'self' blob:;
				base-uri 'self';
				form-action 'self'
			"
		/>
		<meta name="referrer" content="no-referrer" />

		<!-- Title, description, canonical and the og tags are set per route via
		     svelte:head. Do not add defaults here: this markup is emitted first,
		     and a crawler takes the first occurrence, so anything here silently
		     overrides every tool page. -->

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>


		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
